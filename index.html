<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                if (typeof val === 'function') {
                  currentFetch = val;
                }
              }
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              ((typeof event.message === 'string' && event.message.indexOf('Cannot set property fetch') !== -1) ||
                (typeof event.filename === 'string' && event.filename.indexOf('chrome-extension://') === 0))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
